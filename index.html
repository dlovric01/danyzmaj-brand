<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>danyzmaj</title>
<meta name="description" content="danyzmaj">
<meta name="theme-color" content="#171210">
<meta property="og:title" content="danyzmaj">
<meta property="og:url" content="https://www.danyzmaj.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='2.5 0 108.5 97.69'%3E%3Cpath fill='%23121212' fill-rule='nonzero' d='M%2016%2010%20L%2090%2010%20L%2090%2036%20L%2016%2036%20Z%20M%2098.38%2022.49%20L%2024.38%2094.69%20L%207.62%2077.51%20L%2081.62%205.31%20Z%20M%2016%2064%20L%2090%2064%20L%2090%2090%20L%2016%2090%20Z%20M%2052%2010%20L%2070%203%20L%2067%2012%20Z%20M%2086%2061%20L%20108%2077%20L%2086%2093%20L%2093%2077%20Z%20M%2027%2034%20L%2022.5%2047%20L%2018%2034%20Z%20M%2037%2034%20L%2033.5%2043%20L%2030%2034%20Z%20M%2056%2022%20L%2062%2022%20L%2062%2016%20L%2056%2016%20Z%20M%2016%2032.7%20L%2047%2029.6%20L%2047%2027.6%20L%2016%2024.5%20Z'/%3E%3Cpath fill='%23FF6A1F' d='M%205.5%2024.1%20L%205.5%2033.1%20L%2015.5%2028.6%20Z'/%3E%3C/svg%3E">
<style>
@property --p{syntax:'<number>';inherits:true;initial-value:0}
:root{
  --ink:#171210;      /* the press bed */
  --bone:#F2EDE4;     /* the mark      */
  --ember:#FF6A1F;    /* the spark     */
  --ease:cubic-bezier(0.16,1,0.3,1);   /* entrance flourish */
  --reveal:cubic-bezier(0.4,0,0.2,1);  /* the show unfolds  */
  --p:0;              /* the wake      */
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);
  display:grid;place-items:center;
  min-height:100vh;min-height:100svh;
  padding:max(6vmin,1.5rem);
  overflow:hidden;
}
html.burned{--ink:#F2EDE4;--bone:#171210} /* the burned page: paper bed, ink mark (mirrors :root values) */
h1{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip-path:inset(50%);white-space:nowrap;border:0}
.trigger{
  display:block;position:relative;z-index:3;
}
svg{
  display:block;overflow:visible;
  width:min(58vmin,620px);height:auto;
  filter:drop-shadow(0 2px 0 rgb(0 0 0/.55)) drop-shadow(0 28px 48px rgb(0 0 0/.5));
  animation:strike 620ms var(--ease) both;
  /* the type re-sets itself: skeleton, spark, wings, settle */
  --p1:clamp(0,calc(var(--p) / .55),1);            /* Z straightens   */
  --ph:clamp(0,calc((var(--p) - .3) / .15),1);     /* head flips up   */
  --p2:clamp(0,calc((var(--p) - .45) / .45),1);    /* wings unfold    */
  --p3:clamp(0,calc((var(--p) - .78) / .22),1);    /* fire            */
}
.body{fill:var(--bone)}
.hole{fill:var(--ink)}
.acc{fill:var(--ember);animation:pulse 3.6s ease-in-out infinite}
#mark,#spine,#head,#tail,#spark,#fire,.fold,.side,.crown{transform-box:view-box}
.side{transform-origin:53px 23px;transform:scale(1,calc(1 - var(--ph)))}
.crown{transform-origin:53px 23px;transform:scale(1,var(--ph))}
#mark{
  transform-origin:56.75px 48.85px;
  transform:scale(calc((1 - .22*var(--p2)) * (1 - .6*var(--p)*(1 - var(--p))))) translate(0,calc(4.75px*var(--p2)));
}
#spine{
  transform-origin:53px 50px;
  transform:translate(calc(3.75px*var(--p1)),0) scale(1,calc(1 - .12*var(--p1))) rotate(calc(-45.7deg*var(--p1)));
}
#head{
  transform-origin:53px 23px;
  transform:translate(calc(3.75px*var(--p1)),calc(-22.6px*var(--p1))) scale(calc(1 - .2*var(--p1))) rotate(calc(90deg*var(--p1)));
}
#tail{
  transform-origin:53px 77px;
  transform:translate(calc(3.75px*var(--p1)),calc(31.35px*var(--p1))) scale(calc(1 - .45*var(--p1))) rotate(calc(90deg*var(--p1)));
}
.fold{
  transform-origin:56.75px 42px;
  transform:rotate(calc(58deg*(1 - var(--p2)))) scale(var(--p2),calc(.3 + .7*var(--p2)));
}
#spark{
  transform-origin:53px 23px;
  transform:translate(calc(3.75px*var(--p1)),calc(-22.6px*var(--p1))) scale(calc(1 - .2*var(--p1))) rotate(calc(90deg*var(--p1)));
}
#fire{
  transform-origin:15.5px 28.6px;
  transform:translate(0,calc(-5.6px*var(--ph))) scale(calc(1 + 1.6*var(--p3)));
}
/* ── the rampage: a scroll summons the dragon; it strafes the seam and the page burns ── */
#fx{display:none}
html.rampage #fx{display:contents} /* children stack against the dragon, no wrapper context */
#fx>div{position:fixed;pointer-events:none}
#fxdefs{position:absolute;width:0;height:0}
html.rampage{animation:wake 1400ms var(--reveal) both} /* the scroll pulls the mark awake */
html.rampage svg{animation:dragonfire 1ms linear 2150ms forwards} /* strike disarmed; its return re-strikes the fresh page */
html.rampage .trigger{animation:liftoff 800ms cubic-bezier(.6,.05,.9,.5) 1050ms forwards,charge 1250ms cubic-bezier(.4,.08,.62,.92) 2150ms forwards}
html.rampage .body{animation:ignite 1ms linear 2150ms forwards} /* a black shape against the fire */
html.rampage #fire{animation:blaze 130ms linear 2150ms infinite alternate}
html.rampage body{animation:quake 1300ms linear 2150ms} /* the impact shakes the room */
#dim{inset:0;z-index:1;opacity:0;background:color-mix(in srgb,var(--ink) 85%,transparent);
  animation:dimdown 2150ms linear 2150ms forwards} /* the old world recedes so the fire can own the frame */
#preglow{left:-10vw;right:-10vw;bottom:-8vh;height:66vh;z-index:1;opacity:0;filter:blur(22px);
  background:radial-gradient(70% 62% at 50% 100%,var(--ember),color-mix(in srgb,var(--ember) 45%,transparent) 60%,transparent 82%);
  animation:heatgather 1150ms ease-in-out 1400ms forwards} /* the floor breathes — something below is coming */
#pyre,#sear{inset:0}
#pyre{z-index:1;filter:blur(7px);transform:scale(1.07,1.03);transform-origin:50% 100%} /* the burning rim around the seam */
#sear{z-index:2;filter:url(#flamewarp) drop-shadow(0 0 18px var(--ember)) drop-shadow(0 0 70px color-mix(in srgb,var(--ember) 55%,transparent))}
#pyre .clip,#sear .clip{position:absolute;inset:0;
  clip-path:polygon(49.2% 112%,48.8% 112%,49.1% 112%,48.9% 112%,49.3% 112%,49% 112%,49.4% 112%,49.6% 111%,50.4% 111%,50.6% 112%,51% 112%,50.7% 112%,51.1% 112%,50.9% 112%,51.2% 112%,50.8% 112%);
  animation:burnspread 2000ms linear 2300ms forwards}
#pyre .clip{background:var(--ember)}
#sear .clip{background:var(--bone)} /* the seam interior is already the new bed — the settle is seamless */
#sear .clip::after{content:"";position:absolute;inset:0;opacity:0;
  background:linear-gradient(to top,var(--ember),color-mix(in srgb,var(--ember) 45%,transparent) 38%,transparent 70%);
  animation:searfade 2000ms linear 2300ms forwards} /* residual heat cools as the burn completes */
#glow{left:50%;top:50%;width:96vmin;height:96vmin;margin:-48vmin 0 0 -48vmin;z-index:2;opacity:0;filter:blur(22px);
  background:radial-gradient(closest-side,color-mix(in srgb,var(--ember) 55%,transparent),transparent 72%);
  animation:glowride 1250ms cubic-bezier(.4,.08,.62,.92) 2150ms forwards} /* the halo rides the dragon */
#flash{inset:0;z-index:2;opacity:0;
  background:radial-gradient(130% 110% at 50% 100%,color-mix(in srgb,var(--ember) 65%,transparent),transparent 62%);
  animation:flashpulse 420ms ease-out 2150ms forwards} /* the entry concussion */
#embers{left:-30vw;right:-30vw;top:-120vh;bottom:-10vh;z-index:4;opacity:0;
  background:radial-gradient(circle,var(--ember) 1.3px,transparent 2.4px),radial-gradient(circle,color-mix(in srgb,var(--ember) 70%,transparent) 1px,transparent 2px),radial-gradient(circle,color-mix(in srgb,var(--bone) 80%,transparent) .8px,transparent 1.6px);
  background-size:97px 143px,61px 89px,131px 211px;background-position:7px 13px,31px 57px,3px 41px;
  animation:emberrise 2200ms linear 2150ms forwards} /* sparks outlive the beast */
html.burned svg{filter:drop-shadow(0 2px 0 rgb(0 0 0/.14)) drop-shadow(0 28px 48px rgb(0 0 0/.18))} /* paper throws softer shadows */
@keyframes strike{from{opacity:0;transform:scale(1.14) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes wake{to{--p:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.68}}
@keyframes liftoff{
  0%{transform:translateY(0) scale(1)}
  16%{transform:translateY(2.6vh) scale(.97)} /* coils before springing */
  100%{transform:translateY(-118vh) scale(.8)}
}
@keyframes charge{
  0%{transform:translateY(114vh) scale(1.6)}
  100%{transform:translateY(-140vh) scale(1.2)}
}
@keyframes ignite{to{fill:var(--ink)}} /* the beast goes dark — a shadow inside its own light */
@keyframes dragonfire{to{filter:drop-shadow(0 0 12px var(--ember)) drop-shadow(0 0 42px color-mix(in srgb,var(--ember) 60%,transparent))}}
@keyframes blaze{
  from{transform:translate(0,-5.6px) scale(2.6)}
  to{transform:translate(0,-7px) scale(3.1)}
}
@keyframes quake{
  0%,100%{transform:none}
  8%{transform:translate(2px,-3px) rotate(.2deg)}
  16%{transform:translate(-3px,2px) rotate(-.24deg)}
  24%{transform:translate(3px,1px) rotate(.18deg)}
  32%{transform:translate(-2px,-2px) rotate(-.16deg)}
  40%{transform:translate(2px,2px) rotate(.12deg)}
  55%{transform:translate(-2px,1px) rotate(-.1deg)}
  70%{transform:translate(1px,-1px) rotate(.06deg)}
  85%{transform:translate(-1px,1px) rotate(-.04deg)}
}
@keyframes dimdown{0%{opacity:0}25%{opacity:.35}85%{opacity:.25}100%{opacity:0}}
@keyframes heatgather{
  0%{opacity:0;transform:translateY(9vh)}
  28%{opacity:.85;transform:translateY(4vh)}
  46%{opacity:.6;transform:translateY(5vh)}
  62%{opacity:.75;transform:translateY(3vh)}
  78%{opacity:1;transform:translateY(0)} /* the burst — it breaks through here */
  100%{opacity:0;transform:translateY(-4vh)}
}
@keyframes glowride{
  from{opacity:.9;transform:translateY(114vh)}
  to{opacity:.9;transform:translateY(-140vh)}
}
@keyframes flashpulse{0%{opacity:0}25%{opacity:.85}100%{opacity:0}}
@keyframes emberrise{
  0%{opacity:0;transform:rotate(7deg) translateY(18vh)} /* the tilt breaks the lattice — sparks, not graph paper */
  12%{opacity:.85}
  85%{opacity:.7}
  100%{opacity:0;transform:rotate(7deg) translateY(-46vh)}
}
/* the seam: a jagged sliver splits at the center, races up behind the dragon, then devours the width */
@keyframes burnspread{
  0%{clip-path:polygon(49.2% 112%,48.8% 112%,49.1% 112%,48.9% 112%,49.3% 112%,49% 112%,49.4% 112%,49.6% 111%,50.4% 111%,50.6% 112%,51% 112%,50.7% 112%,51.1% 112%,50.9% 112%,51.2% 112%,50.8% 112%)}
  42%{clip-path:polygon(45% 110%,42% 88%,45.5% 66%,43% 44%,46% 24%,44% 8%,47% -4%,48.5% -10%,52% -10%,53.5% -4%,56.5% 8%,54% 24%,57.5% 44%,54.5% 66%,58.5% 88%,55.5% 110%)}
  75%{clip-path:polygon(37% 110%,31% 88%,36% 66%,33% 44%,38% 24%,35% 8%,40% -4%,44% -10%,57% -10%,61% -4%,66% 8%,62% 24%,68% 44%,63% 66%,70% 88%,64% 110%)}
  100%{clip-path:polygon(-12% 112%,-15% 88%,-10% 66%,-14% 44%,-9% 24%,-13% 8%,-11% -4%,-15% -12%,115% -12%,111% -4%,115% 8%,110% 24%,114% 44%,109% 66%,115% 88%,112% 112%)}
}
@keyframes searfade{0%{opacity:.9}45%{opacity:.75}80%{opacity:.45}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:1ms !important;animation-iteration-count:1 !important}
  html{transition:none}
}
</style>
</head>
<body>
<h1>danyzmaj</h1>
<div class="trigger">
<svg viewBox="2.5 0 108.5 97.69" role="img" aria-hidden="true">
  <g id="mark">
    <g id="wings">
      <g id="wingR"><g class="fold">
        <path class="body" d="M 66 26 L 108 8 L 150 4 L 132 24 L 146 36 L 116 40 L 124 54 L 92 52 L 98 66 L 70 54 L 66 52 Z"/>
        <path class="hole" d="M 76 32 L 96 26 L 82 44 Z"/>
      </g></g>
      <g id="wingL" transform="translate(113.5 0) scale(-1 1)"><g class="fold">
        <path class="body" d="M 66 26 L 108 8 L 150 4 L 132 24 L 146 36 L 116 40 L 124 54 L 92 52 L 98 66 L 70 54 L 66 52 Z"/>
        <path class="hole" d="M 76 32 L 96 26 L 82 44 Z"/>
      </g></g>
    </g>
    <g id="tail">
      <path class="body" d="M 16 64 L 90 64 L 90 90 L 16 90 Z M 86 61 L 108 77 L 86 93 L 93 77 Z"/>
    </g>
    <g id="spine">
      <path class="body" d="M 98.38 22.49 L 24.38 94.69 L 7.62 77.51 L 81.62 5.31 Z"/>
    </g>
    <g id="head">
      <g class="side">
        <path class="body" fill-rule="nonzero" d="M 16 10 L 90 10 L 90 36 L 16 36 Z M 52 10 L 70 3 L 67 12 Z M 27 34 L 22.5 47 L 18 34 Z M 37 34 L 33.5 43 L 30 34 Z M 56 22 L 62 22 L 62 16 L 56 16 Z M 16 32.7 L 47 29.6 L 47 27.6 L 16 24.5 Z"/>
        <path class="hole" d="M 56 16 L 62 16 L 62 22 L 56 22 Z M 16 24.5 L 47 27.6 L 47 29.6 L 16 32.7 Z"/>
      </g>
      <g class="crown">
        <path class="body" d="M 80 8 L 56 4 L 34 12 L 18 19 L 14 23 L 18 27 L 34 34 L 56 42 L 80 38 Z M 58 9 L 64 -16 L 52 7 Z M 52 39 L 64 62 L 58 37 Z M 31 14 L 36 3 L 26 16.2 Z M 26 29.8 L 36 43 L 31 32 Z"/>
        <path class="hole" d="M 45 9.5 L 53 9.5 L 53 16 L 45 16 Z M 45 30 L 53 30 L 53 36.5 L 45 36.5 Z M 17 21.5 L 42 22.6 L 42 23.4 L 17 24.5 Z"/>
      </g>
    </g>
    <g id="spark"><g id="fire">
      <path class="acc" d="M 5.5 24.1 L 5.5 33.1 L 15.5 28.6 Z"/>
    </g></g>
  </g>
</svg>
</div>
<div id="fx" aria-hidden="true">
  <div id="dim"></div>
  <div id="preglow"></div>
  <div id="pyre"><div class="clip"></div></div>
  <div id="sear"><div class="clip"></div></div>
  <div id="glow"></div>
  <div id="flash"></div>
  <div id="embers"></div>
</div>
<svg id="fxdefs" aria-hidden="true" focusable="false">
  <filter id="flamewarp" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05 0.012" numOctaves="2" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="26" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<script>
(()=>{
  const r=document.documentElement,
        meta=document.querySelector('meta[name=theme-color]'),
        rm=matchMedia('(prefers-reduced-motion:reduce)'),
        TOTAL=4400,COMMIT=3400; // past COMMIT the beast is gone — the fire finishes what it started
  let anims=null,target=0,pos=0,raf=0,last=0,busy=true;
  setTimeout(()=>busy=false,700); // let the entrance strike land
  const settle=()=>{
    r.classList.toggle('burned');
    meta.setAttribute('content',getComputedStyle(r).getPropertyValue('--ink').trim());
    setTimeout(()=>busy=false,600); // outlive trackpad momentum
  };
  const disarm=()=>{cancelAnimationFrame(raf);raf=0;anims=null;target=pos=0;r.classList.remove('rampage')};
  const finish=()=>{busy=true;disarm();settle()}; // rampage off + burned on resolve in one recalc — seamless
  const tick=t=>{
    raf=requestAnimationFrame(tick);
    if(target<COMMIT&&t-last>1000)target=Math.max(0,target-14); // untended fire dies back down
    pos+=(target-pos)*.16;
    if(!anims)return;
    if(target>=TOTAL&&pos>TOTAL-16){finish();return}
    if(target<=0&&pos<6){disarm();return}
    const ms=Math.min(pos,TOTAL-1);
    for(const a of anims)a.currentTime=ms;
  };
  const push=d=>{
    if(busy)return;
    if(rm.matches){busy=true;settle();return} // no theatrics, same destination
    if(!raf){
      r.classList.add('rampage');
      requestAnimationFrame(()=>{anims=document.getAnimations().filter(a=>a.animationName!=='pulse')});
      raf=requestAnimationFrame(tick);
    }
    last=performance.now();
    target=Math.max(0,Math.min(TOTAL,target+d));
    if(target>COMMIT)target=TOTAL; // point of no return
  };
  addEventListener('wheel',e=>{if(!e.ctrlKey&&e.deltaY&&Math.abs(e.deltaY)>=Math.abs(e.deltaX))push(e.deltaY*1.4)},{passive:true});
  let ty=null;
  addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true});
  addEventListener('touchmove',e=>{if(ty!==null){const y=e.touches[0].clientY;push((ty-y)*3);ty=y}},{passive:true});
  addEventListener('touchend',()=>{ty=null});
  addEventListener('keydown',e=>{
    if(e.key==='ArrowDown')push(320);
    else if(e.key==='PageDown')push(1100);
    else if(e.key==='ArrowUp')push(-320);
    else if(e.key==='PageUp')push(-1100);
  });
})();
</script>
</body>
